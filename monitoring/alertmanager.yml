  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: operator-configured-receiver
    # Configure email_configs or webhook_configs with your approved destination.
    # No notification is sent until a receiver is configured.
