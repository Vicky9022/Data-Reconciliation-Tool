name: Validate Reconcile
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python verify.py
      - run: python benchmark.py
      - run: docker build -t reconcile:test -t reconcile-platform:2.1 .
      - run: python deploy/container_smoke.py --image reconcile-platform:2.1
      - run: docker pull caddy:2-alpine
      - run: python deploy/tls_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: measured-results
          path: |
            measured_results.json
            verification.json
            test_results.txt
            container_smoke_results.json
            tls_smoke_results.json
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: docker compose -f deploy/staging.yaml up --build -d
      - run: python deploy/wait_ready.py
      - run: python -m unittest discover -s tests -p test_integration.py -v
        env:
          RECON_RUN_INTEGRATION: '1'
      - if: always()
        run: docker compose -f deploy/staging.yaml logs --no-color
      - if: always()
        run: docker compose -f deploy/staging.yaml down -v
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt pip-audit bandit pip-tools
      - run: pip-audit -r requirements.lock.txt
      - run: bandit -r server.py enterprise.py distributed.py governance.py engine.py -ll
      - run: pip-compile --generate-hashes --output-file requirements.resolved.txt requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-dependency-candidate
          path: requirements.resolved.txt
