name: Validate Reconcile
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/verify.py
      - run: python benchmarks/benchmark.py --output reports/measured_results.json
      - run: docker build -t reconcile:test -t reconcile-platform:2.1 .
      - run: python scripts/checks/container_smoke.py --image reconcile-platform:2.1
      - run: docker pull caddy:2-alpine
      - run: python scripts/checks/tls_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: measured-results
          path: |
            reports/
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: docker compose -f deploy/staging.yaml up --build -d
      - run: python scripts/checks/wait_ready.py
      - run: python -m unittest discover -s tests -t . -p test_integration.py -v
        env:
          RECON_RUN_INTEGRATION: '1'
      - if: always()
        run: docker compose -f deploy/staging.yaml logs --no-color
      - if: always()
        run: docker compose -f deploy/staging.yaml down -v
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt pip-audit bandit pip-tools
      - run: python -m pip install --no-deps -e .
      - run: pip-audit -r requirements.lock.txt
      - run: bandit -r src/reconcile -ll
      - run: mkdir -p reports && pip-compile --generate-hashes --output-file reports/requirements.resolved.txt requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-dependency-candidate
          path: reports/requirements.resolved.txt
